<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="224" viewBox="0 0 1120 224" role="img" aria-labelledby="title description">
  <title id="title">The SEANA view-generation pipeline</title>
  <desc id="description">A noisy training image passes through a learned variance-stabilizing transform and a frozen denoiser. Independent noise is resampled before the inverse transform produces two sources. Each receives independent SSL transforms before the encoder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b49"/>
      <stop offset="1" stop-color="#203754"/>
    </linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1120" height="224" rx="20" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="28" y="72" width="144" height="74" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="100" y="103" text-anchor="middle" font-size="17" font-weight="600" fill="#f8fafc">Noisy image</text>
    <text x="100" y="125" text-anchor="middle" font-size="12" fill="#a7b5c9">Training data</text>

    <path d="M173 109 H204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="214" y="42" width="382" height="134" rx="14" fill="url(#module)" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="238" y="76" font-size="25" font-weight="700" letter-spacing="1" fill="#5eead4">SEANA</text>
    <text x="238" y="108" font-size="15" fill="#f1f5f9">Learned VST → frozen denoiser</text>
    <text x="238" y="134" font-size="15" fill="#f1f5f9">Independent noise → inverse VST</text>
    <text x="238" y="157" font-size="11" fill="#a7b5c9">Resampling happens in the learned VST space</text>

    <path d="M597 109 H615" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M615 109 V78 H637" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M615 109 V154 H637" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="646" y="54" width="144" height="48" rx="10" fill="#103c3c" stroke="#2dd4bf" stroke-opacity="0.65"/>
    <text x="718" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#99f6e4">Source A</text>
    <rect x="646" y="130" width="144" height="48" rx="10" fill="#30254e" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="718" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#ddd6fe">Source B</text>

    <path d="M791 78 H822" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M791 154 H822" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="832" y="54" width="260" height="48" rx="10" fill="#1e293b" stroke="#475569"/>
    <rect x="832" y="130" width="260" height="48" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="962" y="84" text-anchor="middle" font-size="14" fill="#f1f5f9">SSL transforms → encoder</text>
    <text x="962" y="160" text-anchor="middle" font-size="14" fill="#f1f5f9">SSL transforms → encoder</text>
    <text x="560" y="207" text-anchor="middle" font-size="12" fill="#a7b5c9">Independent noise draws. Independent SSL transforms. Your existing learning objective.</text>
  </g>
</svg>
